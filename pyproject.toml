[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-pipeline"
version = "0.1.0"
description = "Production knowledge-base update pipeline for chatbot retrieval systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hosted = [
  "Flask>=3.1.2,<4",
  "Flask-WTF>=1.2.2,<2",
  "Flask-Limiter[redis]>=4.0,<5",
  "waitress>=3.0.2,<4",
]

[tool.setuptools.packages.find]
include = ["kb_pipeline*"]

[tool.setuptools.package-data]
kb_pipeline = ["web/*.html", "web/*.css", "web/*.js", "web/assets/*.png", "web/vendor/*.js", "web/vendor/*.LICENSE", "data/*.json"]
